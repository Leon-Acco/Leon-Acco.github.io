<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | truncate: 150 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.author }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%239a3b2a'/><text x='50' y='71' font-size='58' font-family='Georgia,serif' fill='%23faf8f3' text-anchor='middle'>A</text></svg>">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('acho-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.mermaid %}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    const dark = document.documentElement.dataset.theme === 'dark';
    mermaid.initialize({
      startOnLoad: false,
      theme: dark ? 'dark' : 'neutral',
      fontFamily: '-apple-system, PingFang SC, sans-serif',
      themeVariables: { background: 'transparent', primaryColor: dark ? '#23232c' : '#f3f0e8', primaryTextColor: dark ? '#ece9e2' : '#17181c', lineColor: dark ? '#85838c' : '#8a8f98' }
    });
    window.addEventListener('load', () => {
      document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        code.closest('pre').replaceWith(div);
      });
      mermaid.run({ querySelector: '.mermaid' }).catch(() => {});
    });
  </script>
  {% endif %}
  {% if page.math %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="{{ '/' | relative_url }}">Acho<span class="logo-dot">.</span><span class="logo-mark">notes</span></a>
      <nav class="nav" aria-label="主导航">
        {% assign here = page.url %}
        <a href="{{ '/' | relative_url }}" class="{% if here == '/' %}is-active{% endif %}">首页</a>
        <a href="{{ '/ai/' | relative_url }}" class="{% if here contains '/ai/' %}is-active{% endif %}">AI</a>
        <a href="{{ '/java/' | relative_url }}" class="{% if page.categories contains 'java' %}is-active{% endif %}">Java</a>
        <a href="{{ '/iot/' | relative_url }}" class="{% if here contains '/iot/' %}is-active{% endif %}">车联网</a>
        <a href="{{ '/bigdata/' | relative_url }}" class="{% if here contains '/bigdata/' %}is-active{% endif %}">大数据</a>
        <a href="{{ '/tools/' | relative_url }}" class="{% if here contains '/tools/' %}is-active{% endif %}">工程效率</a>
        <a href="{{ '/archive/' | relative_url }}" class="{% if here contains '/archive/' %}is-active{% endif %}">归档</a>
        <a href="{{ '/about/' | relative_url }}" class="{% if here contains '/about/' %}is-active{% endif %}">关于</a>
      </nav>
      <div class="header-tools">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="搜索…" aria-label="搜索文章" autocomplete="off">
          <div id="search-results" class="search-results" hidden></div>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色" title="切换深浅色">
          <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-inner">
        <p style="margin:0">© {{ site.time | date: '%Y' }} Acho · 车联网 / Java / AI 工程笔记</p>
        <div class="footer-links">
          <a href="https://github.com/Leon-Acco" target="_blank" rel="noopener">GitHub</a>
          <a href="https://www.yuque.com/u22429903" target="_blank" rel="noopener">语雀</a>
          <a href="https://juejin.cn/user/4191761160999496" target="_blank" rel="noopener">掘金</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </div>
      </div>
      <p class="foot-quote">先把系统跑通，再把它讲清楚。</p>
    </div>
  </footer>

  <script>
    // 主题切换
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var moon = document.getElementById('icon-moon');
      var sun = document.getElementById('icon-sun');
      function paint() {
        var dark = root.dataset.theme === 'dark';
        moon.hidden = dark;
        sun.hidden = !dark;
      }
      paint();
      btn && btn.addEventListener('click', function () {
        var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('acho-theme', next); } catch (e) {}
        paint();
      });
    })();

    // 全站搜索（基于 search.json）
    (function () {
      var box = document.getElementById('search-input');
      var panel = document.getElementById('search-results');
      if (!box || !panel) return;
      var DB = null;
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
      box.addEventListener('input', async function (e) {
        var q = e.target.value.trim().toLowerCase();
        if (!q) { panel.hidden = true; return; }
        if (!DB) DB = await (await fetch('{{ "/search.json" | relative_url }}')).json();
        var hits = DB.filter(function (p) {
          return (p.title + ' ' + (p.tags || '') + ' ' + (p.cat || '') + ' ' + p.excerpt).toLowerCase().indexOf(q) >= 0;
        }).slice(0, 8);
        panel.innerHTML = hits.length
          ? hits.map(function (p) { return '<a href="' + p.url + '"><b>' + esc(p.title) + '</b><span>' + p.date + '</span></a>'; }).join('')
          : '<span class="empty">没有找到相关文章</span>';
        panel.hidden = false;
      });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-box')) panel.hidden = true;
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') panel.hidden = true;
        if (e.key === '/' && document.activeElement !== box) { e.preventDefault(); box.focus(); }
      });
    })();
  </script>
</body>
</html>
