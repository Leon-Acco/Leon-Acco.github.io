<rect x="850.0" y="400.0" width="640.0" height="80.0" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2.0" />
<text x="60.0" y="52.8" font-size="28.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">解绑残留为何不可能再发生 — 新旧方案时序对比</text>
<text x="60.0" y="86.4" font-size="14.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">旧: 动态批次整行读改写, 在途窗口把旧 VIN 带回   |   新: keyBy 串行 + 广播即时 + 版本号触发</text>
<text x="60.0" y="142.0" font-size="20.0" fill="#b91c1c" text-anchor="start" dominant-baseline="central" xml:space="preserve">✗ 旧方案: Ignite 批量读改写</text>
<text x="115.0" y="225.8" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">① 动态批次 getAll</text>
<text x="115.0" y="241.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">读到整行(含旧 VIN)</text>
<text x="285.0" y="319.8" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">② Canal 解绑</text>
<text x="285.0" y="335.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">UPDATE SET VIN=NULL</text>
<text x="455.0" y="225.8" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">③ 批次 upsertAll</text>
<text x="455.0" y="241.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">整行写回(带回旧 VIN)</text>
<text x="625.0" y="319.8" font-size="13.0" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">④ 残留!</text>
<text x="625.0" y="335.4" font-size="13.0" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">宽行 VIN 复活</text>
<text x="400.0" y="414.4" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">读侧仍看到旧绑定 → 只能靠 两阶段对账补偿 定期清理</text>
<text x="400.0" y="431.2" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">(阶段一失败必须跳过阶段二, 防误清)</text>
<text x="80.0" y="503.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">打过的补丁(复杂度失控): 列族所有权 SQL / 乱序守卫 WHERE /</text>
<text x="80.0" y="517.6" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">复活探测器 / BIND_TS / 两阶段对账 —— 全是给错误架构打的补丁</text>
<text x="850.0" y="142.0" font-size="20.0" fill="#047857" text-anchor="start" dominant-baseline="central" xml:space="preserve">✓ 新方案: Flink 三条防线</text>
<text x="905.0" y="211.8" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">① keyBy 串行</text>
<text x="905.0" y="227.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">同设备同 subtask</text>
<text x="905.0" y="243.0" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">读改写窗口不存在</text>
<text x="1075.0" y="319.8" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">② 绑定事件即时刷</text>
<text x="1075.0" y="335.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">广播 put + Redis HSET</text>
<text x="1075.0" y="351.0" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">vinCode=空串, 版本号v+1</text>
<text x="1245.0" y="211.8" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">③ onTimer 版本号触发</text>
<text x="1245.0" y="227.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">空闲设备 ≤5min 内</text>
<text x="1245.0" y="243.0" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">用新静态重发快照</text>
<text x="1415.0" y="319.8" font-size="13.0" fill="#047857" text-anchor="middle" dominant-baseline="central" xml:space="preserve">✓ 无残留</text>
<text x="1415.0" y="335.4" font-size="13.0" fill="#047857" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Redis 即时清空</text>
<text x="1415.0" y="351.0" font-size="13.0" fill="#047857" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Doris ≤5min 覆盖</text>
<text x="1170.0" y="414.4" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">解绑即时生效: Redis vinCode 字段当帧清空</text>
<text x="1170.0" y="431.2" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Doris 宽表 ≤5min 内被新快照覆盖(版本号触发, 无流量也刷)</text>
<text x="850.0" y="503.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">零补丁: 不需要对账/补偿/探测器 —— 架构对了就不需要补丁</text>
<text x="850.0" y="517.6" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">(旧方案的 5 类补丁代码在新架构中全部无存在必要)</text>
</svg>