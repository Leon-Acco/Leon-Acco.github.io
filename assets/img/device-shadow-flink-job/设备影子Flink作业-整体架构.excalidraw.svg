<text x="60.0" y="52.8" font-size="28.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">设备影子 Flink 作业 — 整体架构</text>
<text x="60.0" y="84.4" font-size="14.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">dst-iot-shadow-flink-job · 替代 Ignite 写入 · keyBy 串行从架构上消灭并发覆盖</text>
<text x="60.0" y="139.6" font-size="16.0" fill="#3b82f6" text-anchor="start" dominant-baseline="central" xml:space="preserve">Kafka 动态流 + MySQL CDC 静态流  ──▶  keyBy(设备) 串行合并  ──▶  Redis Hash 实时层(毫秒)  +  Doris 宽表 持久层(5min)</text>
<text x="60.0" y="212.0" font-size="20.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">① 数据源</text>
<text x="229.9" y="264.4" font-size="15.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TBOX Kafka topic</text>
<text x="229.9" y="282.4" font-size="15.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">GB32960 二进制报文 (cmd=0x02)  30k</text>
<text x="229.9" y="300.4" font-size="15.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TPS</text>
<text x="230.0" y="369.2" font-size="15.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">ADAS Kafka topic</text>
<text x="230.0" y="387.2" font-size="15.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">二进制自检报文 (msgId=0x0200)</text>
<text x="229.9" y="481.4" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">MySQL 静态 4 表</text>
<text x="229.9" y="498.2" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">basic_device_info /</text>
<text x="229.9" y="515.0" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">basic_vehicle_tbox</text>
<text x="229.9" y="531.8" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">basic_adas_info / basic_vehicle_adas</text>
<text x="70.0" y="573.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">档案(快照语义) + 绑定(vinCode 置空=解绑)</text>
<text x="70.0" y="587.6" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">main() JDBC bootstrap 全量 + binlog CDC 增量</text>
<text x="75.0" y="649.2" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">Kafka headers (网关写入):</text>
<text x="75.0" y="663.6" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">vinCode=LSVAJ3...  recvTime=1769...</text>
<text x="75.0" y="678.0" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">cmd=0x02  protocolType=adas</text>
<text x="75.0" y="692.4" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">payload = 32960 二进制帧</text>
<text x="470.0" y="212.0" font-size="20.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">② Flink 作业 (standalone, 并行度由集群控制)</text>
<text x="640.0" y="283.9" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TboxReportDeserializer</text>
<text x="640.0" y="300.7" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">0201 整车 / 0205 定位 / 020A 终端</text>
<text x="640.0" y="365.9" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">AdasReportDeserializer</text>
<text x="640.0" y="382.7" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">0x0200 自检 flag bit0-3 位提取</text>
<text x="830.0" y="307.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">union → DeviceReport 统一模型</text>
<text x="830.0" y="321.6" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">(缺席子报文 = 字段 null)</text>
<text x="645.0" y="480.9" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">keyBy</text>
<text x="645.0" y="497.7" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TBOX:{devCode}</text>
<text x="835.0" y="474.7" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">&quot;TBOX:866120701234567&quot;</text>
<text x="835.0" y="489.1" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">同设备 → 同 subtask 串行</text>
<text x="835.0" y="503.5" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">并发覆盖 / 解绑残留 在此消失</text>
<text x="490.0" y="568.8" font-size="18.0" fill="#3b82f6" text-anchor="start" dominant-baseline="central" xml:space="preserve">ShadowDeviceProcessFunction (核心算子)</text>
<text x="750.0" y="612.9" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">processElement · 高频 · 每条消息</text>
<text x="750.0" y="629.7" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">字段级合并有效值进 Keyed State → 主输出 Redis</text>
<text x="750.0" y="688.9" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">processBroadcastElement · 低频 · 静态事件</text>
<text x="750.0" y="705.7" font-size="14.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">档案/绑定合并广播状态 · 设备删除→Doris DELETE+Redis DEL</text>
<text x="750.0" y="764.9" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">onTimer · 周期 · 默认5min (边界对齐+hash散列防惊群)</text>
<text x="750.0" y="781.7" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">状态快照 + 广播静态富化 → 侧输出 Doris</text>
<text x="495.0" y="851.2" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">有效值合并规则 (ShadowFieldMerger):</text>
<text x="495.0" y="865.6" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">locState bit0=1 → 定位无效, 经纬度成对放弃不覆盖</text>
<text x="495.0" y="880.0" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">0xFE/0xFF 信号不覆盖 | 子报文缺失=null 不覆盖</text>
<text x="495.0" y="894.4" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">serverTime 落后 → 整帧丢弃(设备时钟不可信)</text>
<text x="615.1" y="993.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Keyed State (TTL 180d)</text>
<text x="615.1" y="1009.0" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TboxShadowRow / AdasShadowRow</text>
<text x="615.1" y="1024.6" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每字段最后有效值</text>
<text x="890.0" y="993.4" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Broadcast State (全 subtask)</text>
<text x="890.0" y="1009.0" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">静态数据(档案+绑定)</text>
<text x="890.0" y="1024.6" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">+ 全局版本号 v</text>
<text x="490.0" y="1073.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">版本号 v 机制: processBroadcastElement 不能写 Keyed State,</text>
<text x="490.0" y="1087.6" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">静态变更(尤其解绑)靠版本号让空闲设备在下一个 onTimer 重发 → 解绑残留封口</text>
<text x="1230.0" y="212.0" font-size="20.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">③ 输出层</text>
<text x="1400.0" y="290.2" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Redis Hash · 实时层(毫秒)</text>
<text x="1400.0" y="307.0" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">shadow:tbox:{devCode}</text>
<text x="1400.0" y="323.8" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">shadow:adas:{devCode}</text>
<text x="1230.0" y="473.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">JedisPool + Pipeline 攒批 200条/1s</text>
<text x="1230.0" y="487.6" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">30k TPS 下每 subtask 每秒约 1 次 sync</text>
<text x="1235.0" y="395.7" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">HSET shadow:tbox:86612070...</text>
<text x="1235.0" y="410.1" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">serverTime 1769... latitude 31492000</text>
<text x="1235.0" y="424.5" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">speed 355   (只写本帧有效字段)</text>
<text x="1400.0" y="577.2" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Doris UNIQUE KEY MoW · 持久层(5min)</text>
<text x="1400.0" y="594.0" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">tbox_device_shadow / adas_device_shadow</text>
<text x="1400.0" y="610.8" font-size="14.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每设备一行 upsert = 只存最新一条</text>
<text x="1235.0" y="689.7" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">{&quot;dev_code&quot;:&quot;86612...&quot;,&quot;speed&quot;:355,</text>
<text x="1235.0" y="704.1" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve"> &quot;__DORIS_DELETE_SIGN__&quot;:0}</text>
<text x="1235.0" y="718.5" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">删除事件=1 → 秒级删整行</text>
<text x="1128.0" y="447.2" font-size="12.0" fill="#047857" text-anchor="start" dominant-baseline="central" xml:space="preserve">主输出 · 实时</text>
<text x="1158.0" y="667.2" font-size="12.0" fill="#047857" text-anchor="start" dominant-baseline="central" xml:space="preserve">侧输出 · 5min</text>
