<text x="120.0" y="76.4" font-size="34.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">车辆里程计算 · 业务全链路</text>
<text x="120.0" y="127.4" font-size="19.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">车上的一条报数，怎么变成报表里「这一小时开了几公里」</text>
<text x="250.0" y="330.0" font-size="20.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">车载终端</text>
<text x="610.5" y="330.0" font-size="20.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">32960 网关</text>
<text x="1000.0" y="329.2" font-size="22.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Flink 实时清洗</text>
<text x="1395.0" y="330.0" font-size="20.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Doris 明细表</text>
<text x="1790.0" y="329.2" font-size="22.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每小时定时聚合</text>
<text x="2180.0" y="330.0" font-size="20.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">小时汇总表</text>
<text x="250.0" y="439.6" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">仪表盘总里程</text>
<text x="250.0" y="458.8" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">只上报这一个数</text>
<text x="610.0" y="439.6" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">32960 国标协议</text>
<text x="610.0" y="458.8" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">网关补上车架号</text>
<text x="610.0" y="478.0" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">投递到消息队列</text>
<text x="1000.5" y="439.6" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">扔掉不合规的报数</text>
<text x="1000.5" y="458.8" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">里程越界 / 时间异常</text>
<text x="1000.5" y="478.0" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">单次跳变过大</text>
<text x="1395.0" y="439.6" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">清洗后的明细</text>
<text x="1395.0" y="458.8" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">一条一行</text>
<text x="1395.0" y="478.0" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">保留近 12 个月</text>
<text x="1790.0" y="439.6" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">把「累计里程」换算成</text>
<text x="1790.0" y="458.8" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">「这一小时开了几公里」</text>
<text x="2180.5" y="439.6" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">报表、大屏、查询接口</text>
<text x="2180.5" y="458.8" font-size="16.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">都查这张表</text>
<text x="1790.0" y="168.8" font-size="18.0" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">报表最长延迟 1 小时</text>
<text x="120.0" y="621.6" font-size="26.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">同一条报数，在两张表里的样子</text>
<text x="150.0" y="716.2" font-size="17.0" fill="#93c5fd" text-anchor="start" dominant-baseline="central" xml:space="preserve">Doris · 车辆里程明细表（Flink 写入）</text>
<text x="150.0" y="762.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">{&quot;uid&quot;: &quot;HGCH1KB68RZ015679&quot;,</text>
<text x="150.0" y="783.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve"> &quot;data_time&quot;: &quot;2026-09-17 13:04:00&quot;,</text>
<text x="150.0" y="804.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve"> &quot;vin&quot;: &quot;HGCH1KB68RZ015679&quot;,</text>
<text x="150.0" y="825.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve"> &quot;cmd&quot;: 2,</text>
<text x="150.0" y="846.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve"> &quot;mileage_total&quot;: 50868.4}</text>
<text x="910.0" y="734.2" font-size="17.0" fill="#b45309" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每小时定时任务</text>
<text x="910.0" y="754.6" font-size="17.0" fill="#b45309" text-anchor="middle" dominant-baseline="central" xml:space="preserve">mileage = MAX − MIN</text>
<text x="1110.0" y="716.2" font-size="17.0" fill="#93c5fd" text-anchor="start" dominant-baseline="central" xml:space="preserve">Doris · 车辆小时里程汇总表（定时任务写入）</text>
<text x="1110.0" y="762.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">uid         = HGCH1KB68RZ015679</text>
<text x="1110.0" y="783.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">window_hour = 2026-09-17 13:00:00</text>
<text x="1110.0" y="804.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">min_mileage = 50857.8</text>
<text x="1110.0" y="825.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">max_mileage = 50870.8</text>
<text x="1110.0" y="846.5" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">mileage     = 13.0</text>
<text x="1500.0" y="843.0" font-size="15.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">← 这一小时实际开了 13 公里</text>
<text x="120.0" y="1030.2" font-size="17.0" fill="#374151" text-anchor="start" dominant-baseline="central" xml:space="preserve">为什么用 MAX − MIN（极差）？车上上报的是「累计里程」，会乱序、会重复、会补发，</text>
<text x="120.0" y="1050.6" font-size="17.0" fill="#374151" text-anchor="start" dominant-baseline="central" xml:space="preserve">直接拿「最后一条 − 第一条」不可靠；取极差能更稳地还原这一小时的真实行驶量。</text>
</svg>