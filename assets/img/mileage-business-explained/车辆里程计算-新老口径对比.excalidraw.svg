text{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif}
</style>
<rect x="185.0" y="294.0" width="30.0" height="12.0" rx="2" fill="#a7f3d0" stroke="#047857" stroke-width="2.0" />
<rect x="1684.0" y="294.0" width="30.0" height="12.0" rx="2" fill="#fed7aa" stroke="#c2410c" stroke-width="2.0" />
<polyline points="200.0,300.0 1700.0,300.0" fill="none" stroke="#1e3a5f" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" />
<polyline points="120.0,415.0 1800.0,415.0" fill="none" stroke="#64748b" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8,6"/>
<rect x="120.0" y="535.0" width="560.0" height="150.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.0" />
<rect x="1020.0" y="535.0" width="560.0" height="150.0" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2.0" />
<rect x="120.0" y="780.0" width="1460.0" height="72.0" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.0" />
<text x="120.0" y="76.4" font-size="34.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">双里程链：一小时里程怎么差出 2 万公里</text>
<text x="120.0" y="127.4" font-size="19.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">同一辆车、同一小时，设备并行上报两条基准相差约 2.5 万公里的里程链</text>
<text x="120.0" y="178.2" font-size="22.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">场景：同一辆车 · 同一小时（13:00 – 14:00）</text>
<text x="950.0" y="218.8" font-size="18.0" fill="#dc2626" text-anchor="middle" dominant-baseline="central" xml:space="preserve">两条链基准差 ≈ 24970 公里</text>
<text x="205.0" y="249.0" font-size="15.0" fill="#047857" text-anchor="middle" dominant-baseline="central" xml:space="preserve">链 A · 补发</text>
<text x="205.0" y="267.0" font-size="15.0" fill="#047857" text-anchor="middle" dominant-baseline="central" xml:space="preserve">≈ 50858 – 50871</text>
<text x="1699.0" y="249.0" font-size="15.0" fill="#c2410c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">链 B · 实时</text>
<text x="1699.0" y="267.0" font-size="15.0" fill="#c2410c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">≈ 75828 – 75836</text>
<text x="204.0" y="326.4" font-size="14.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">50850</text>
<text x="1680.0" y="326.4" font-size="14.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">75850</text>
<text x="960.0" y="351.8" font-size="13.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">（横轴 = 累计里程值，线性刻度；每簇真实宽度已放大显示）</text>
<text x="120.0" y="466.4" font-size="24.0" fill="#dc2626" text-anchor="start" dominant-baseline="central" xml:space="preserve">旧口径（当前线上）</text>
<text x="120.0" y="501.6" font-size="16.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">同一窗口内，两条链的 min / max 混在一起取差</text>
<text x="150.0" y="580.2" font-size="19.0" fill="#b91c1c" text-anchor="start" dominant-baseline="central" xml:space="preserve">MIN  = 50857.8（链 A）</text>
<text x="150.0" y="608.8" font-size="19.0" fill="#b91c1c" text-anchor="start" dominant-baseline="central" xml:space="preserve">MAX  = 75835.8（链 B）</text>
<text x="150.0" y="637.2" font-size="19.0" fill="#b91c1c" text-anchor="start" dominant-baseline="central" xml:space="preserve">mileage = 24978.0 公里</text>
<text x="120.0" y="722.8" font-size="18.0" fill="#dc2626" text-anchor="start" dominant-baseline="central" xml:space="preserve">真实只开了 8 ~ 13 公里 → 虚增约 2000 倍</text>
<text x="1020.0" y="466.4" font-size="24.0" fill="#047857" text-anchor="start" dominant-baseline="central" xml:space="preserve">新口径（待上线）</text>
<text x="1020.0" y="501.6" font-size="16.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">按中位数劈成两簇，只保留多数派那一簇</text>
<text x="1050.0" y="579.5" font-size="18.0" fill="#065f46" text-anchor="start" dominant-baseline="central" xml:space="preserve">① 按中位数把点劈成高低两簇</text>
<text x="1050.0" y="606.5" font-size="18.0" fill="#065f46" text-anchor="start" dominant-baseline="central" xml:space="preserve">② 点数多的一簇胜出（多数派）</text>
<text x="1050.0" y="633.5" font-size="18.0" fill="#065f46" text-anchor="start" dominant-baseline="central" xml:space="preserve">③ 只在胜出簇内取极差、滤离群点</text>
<text x="1020.0" y="722.8" font-size="18.0" fill="#047857" text-anchor="start" dominant-baseline="central" xml:space="preserve">50870.8 − 50857.8 = 13.0 公里（恢复正常）</text>
<text x="150.0" y="807.2" font-size="16.0" fill="#92400e" text-anchor="start" dominant-baseline="central" xml:space="preserve">注意：新口径 SQL 已写好但尚未上线（sql/2026-09-11-zhangchao-doris.sql），当前线上仍是旧口径；且新口径只在聚合层防御，</text>
<text x="150.0" y="829.6" font-size="16.0" fill="#92400e" text-anchor="start" dominant-baseline="central" xml:space="preserve">原始明细表仍会被双链污染。</text>
</svg>