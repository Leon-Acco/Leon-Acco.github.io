<text x="60.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">定时器线程</text>
<text x="340.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">commonPool 登录线程</text>
<text x="660.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">Netty EventLoop</text>
<text x="960.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">上级平台</text>
<text x="160.1" y="164.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">run() 定时触发</text>
<text x="160.1" y="183.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">init(socketConf)</text>
<text x="160.0" y="279.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">reconnect()</text>
<text x="160.0" y="298.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">ChannelManager 中</text>
<text x="160.0" y="318.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">有活跃通道？</text>
<text x="159.9" y="414.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">createChannel()</text>
<text x="159.9" y="433.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">bootstrap.connect()</text>
<text x="760.0" y="409.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">连接成功回调</text>
<text x="760.0" y="428.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">设置 CH/SOCKET_CONFIG</text>
<text x="760.0" y="448.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">init: LOGIN=-1</text>
<text x="760.0" y="467.2" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">runAsync(loginChannel)</text>
<text x="439.9" y="589.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">loginChannel 循环</text>
<text x="439.9" y="608.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每 200ms 发 cmd05 登录包</text>
<text x="1060.0" y="589.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">校验登入</text>
<text x="1060.0" y="709.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">返回 0x05 登录应答</text>
<text x="760.0" y="689.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">channelRead</text>
<text x="760.0" y="708.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">① 先同步 writeLog</text>
<text x="760.0" y="728.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">② 再处理 cmd==0x05</text>
<text x="760.0" y="839.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">成功: LOGIN=1</text>
<text x="760.0" y="858.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">ChannelManager.addChannel</text>
<text x="439.9" y="839.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">检测到 LOGIN==1</text>
<text x="439.9" y="858.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">退出循环</text>
<text x="160.0" y="364.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">否(未登记)</text>
<text x="460.0" y="427.2" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">连接建立</text>
<text x="615.0" y="524.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">runAsync</text>
<text x="750.0" y="597.2" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">cmd05 登录包</text>
<text x="910.0" y="707.2" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">0x05 应答</text>
<text x="599.9" y="849.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">LOGIN 置位</text>
<text x="590.0" y="216.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">⚠ 风险点</text>
<text x="590.0" y="234.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">addChannel 仅在登录成功后执行</text>
<text x="590.0" y="252.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">登录窗口期内 reconnect 判定无通道</text>
<text x="590.0" y="270.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">→ 同一 channelKey 重复建连+登录洪泛</text>
</svg>