<text x="60.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">RocketMQ 拉取线程</text>
<text x="380.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">ChannelService / 过滤器</text>
<text x="720.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">Netty EventLoop</text>
<text x="1040.0" y="85.8" font-size="18.0" fill="#495057" text-anchor="start" dominant-baseline="central" xml:space="preserve">上级平台 / MQ</text>
<text x="180.0" y="174.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">poll(timeout) 批量拉取</text>
<text x="180.0" y="193.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">pullBatchSize 条</text>
<text x="180.0" y="294.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">过滤校验</text>
<text x="180.0" y="313.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">isEnable / vin / uid /</text>
<text x="180.0" y="333.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">平台转发数据过滤</text>
<text x="179.9" y="444.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">ChannelFactory.getChannel</text>
<text x="179.9" y="463.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">随机取通道</text>
<text x="179.9" y="483.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">+ isLoginSuccess 校验</text>
<text x="500.0" y="444.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TranspondFilter.process</text>
<text x="500.0" y="463.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">校验码→字段裁剪</text>
<text x="500.0" y="483.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Wrapper32960 封装</text>
<text x="500.0" y="604.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">channel.writeAndFlush</text>
<text x="500.0" y="714.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">writeLog(PUSH) 同步日志</text>
<text x="500.0" y="733.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">+ addCallback</text>
<text x="500.0" y="753.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">(5s 过期回调队列)</text>
<text x="1160.0" y="604.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">接收数据并返回应答</text>
<text x="840.0" y="714.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">channelRead</text>
<text x="840.0" y="733.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">writeLog(ACK) 同步</text>
<text x="840.0" y="753.0" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">runCallback(true)</text>
<text x="1160.0" y="834.6" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">回调成功</text>
<text x="1160.0" y="853.8" font-size="16.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">commitSingleOffset</text>
<text x="340.0" y="860.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">ClearExpireCallbackTimer 每 1s 清理：</text>
<text x="340.0" y="878.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">回调过期(&gt;5s)或通道断连 → call(false)</text>
<text x="340.0" y="896.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">→ 不提交 offset，消息重投</text>
<text x="670.0" y="329.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">不通过/空消息 → 直接提交 offset</text>
<text x="340.0" y="464.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">原始报文</text>
<text x="830.0" y="604.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TCP 发送</text>
<text x="1000.0" y="664.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">数据应答</text>
<text x="1010.0" y="779.6" font-size="14.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">触发回调</text>
