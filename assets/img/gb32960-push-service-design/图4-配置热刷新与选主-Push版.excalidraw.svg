<text x="420.0" y="23.2" font-size="22.0" fill="#1e1e1e" text-anchor="start" dominant-baseline="central" xml:space="preserve">配置热刷新编排 与 单通道选主</text>
<text x="240.0" y="100.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Nacos：transpond.sockets</text>
<text x="240.0" y="118.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">@RefreshScope 热刷新</text>
<text x="239.9" y="229.6" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TranspondConf（配置根）</text>
<text x="240.1" y="335.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">SocketConfChannelRefreshTimer</text>
<text x="240.1" y="353.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">cron 定时（Nacos 下发）</text>
<text x="240.1" y="371.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">@PostConstruct 立即执行一次</text>
<text x="740.0" y="105.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">① ensureLockHolders</text>
<text x="740.0" y="123.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">同步单通道锁守护线程（随配置增/删）</text>
<text x="740.0" y="235.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">② shouldTeardown</text>
<text x="740.0" y="253.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">isCancel=true → 拆除消费者+通道</text>
<text x="740.0" y="271.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">isSingle 且非主节点 → 拆除待命</text>
<text x="740.1" y="376.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">③ 正常工作链路</text>
<text x="740.1" y="394.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">connectionManager.ensureChannels</text>
<text x="740.1" y="412.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">（配置变更整体重建/扩缩容/补齐）</text>
<text x="740.1" y="430.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">consumerRegistry.init（配置变更重建）</text>
<text x="239.9" y="497.1" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">SingleChannelLockManager</text>
<text x="239.9" y="515.1" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每单通道 topic 一个守护虚拟线程</text>
<text x="239.9" y="533.1" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">lockInterruptibly 阻塞持锁</text>
<text x="239.9" y="551.1" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Redisson 看门狗自动续期</text>
<text x="239.9" y="569.1" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">丢锁/中断 → 下轮 cron 拆除</text>
<text x="240.0" y="685.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Redis</text>
<text x="240.0" y="703.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">IOT:TRANSPOND:P32960:SINGLE_LOCK:*</text>
<text x="740.0" y="550.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">TranspondManagerTimer（每 3 分钟）</text>
<text x="740.0" y="568.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">DB basic_transfer_info → TranspondFilterCacheManager</text>
<text x="1150.0" y="550.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">MySQL</text>
<text x="1150.0" y="568.2" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">basic_transfer_info</text>
<text x="890.0" y="696.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">⚠ 已知缺口（2026-08-10 代码审查发现，待修）</text>
<text x="890.0" y="714.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">1. topic 从 sockets 列表整条删除 → 不触发拆除（消费者/通道残留运行）</text>
<text x="890.0" y="732.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">2. 新增 topic：规则缓存空窗最长 3min，期间消息按丢弃处理</text>
<text x="890.0" y="750.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">3. TranspondManagerTimer 的 getIsCancel() 拆箱：isCancel 为空时 NPE 中断整轮刷新</text>
<text x="460.0" y="220.6" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每轮先同步锁</text>
<text x="1000.0" y="545.6" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">读规则</text>
</svg>