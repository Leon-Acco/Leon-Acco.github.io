<text x="400.0" y="23.2" font-size="22.0" fill="#1e1e1e" text-anchor="start" dominant-baseline="central" xml:space="preserve">登录机制（状态机）与断连自愈</text>
<text x="205.0" y="294.6" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">IDLE</text>
<text x="440.0" y="174.6" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">CONNECTING</text>
<text x="445.0" y="434.6" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">LOGGING_IN</text>
<text x="685.0" y="294.6" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">READY</text>
<text x="312.6" y="213.0" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">connect()</text>
<text x="445.0" y="274.3" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">连接成功→发 cmd05</text>
<text x="445.0" y="289.9" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">注册 10s 登录超时</text>
<text x="582.5" y="336.8" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">登录应答成功</text>
<text x="582.5" y="352.4" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">loginFailures=0</text>
<text x="307.4" y="222.0" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">连接失败→退避</text>
<text x="287.5" y="382.0" font-size="13.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">拒绝/超时→close→退避</text>
<text x="445.1" y="290.6" font-size="13.0" fill="#c92a2a" text-anchor="middle" dominant-baseline="central" xml:space="preserve">channelInactive</text>
<text x="1060.0" y="107.8" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">断连清理（channelInactive）</text>
<text x="1060.0" y="125.8" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">1. 取消登录相关任务（登录超时/心跳）</text>
<text x="1060.0" y="143.8" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">2. drainPending：pendingQueue 全部 complete(false)</text>
<text x="1060.0" y="161.8" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">   → 在途消息回源重发，不丢</text>
<text x="1060.0" y="179.8" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">3. setState(IDLE)</text>
<text x="1060.0" y="197.8" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">4. 分组全不 READY → consumer.suspend()</text>
<text x="1060.0" y="286.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">指数退避重连（scheduleReconnect）</text>
<text x="1060.0" y="304.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">1s→2s→4s→…→60s 封顶，±20% 抖动防羊群</text>
<text x="1060.0" y="322.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">失败次数 loginFailures 驱动，登录成功清零</text>
<text x="1060.0" y="340.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">重连日志 LogSampler 30s 采样防刷屏</text>
<text x="1060.0" y="431.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">心跳与空闲检测</text>
<text x="1060.0" y="449.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">WRITER_IDLE(heartbeatIntervalSec=30s) 且 READY</text>
<text x="1060.0" y="467.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">  → 发 0x07 心跳帧</text>
<text x="1060.0" y="485.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">READER_IDLE(socketTimeOut=120s) → close → 退避重连</text>
<text x="1060.0" y="575.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">恢复链路</text>
<text x="1060.0" y="593.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">重连成功 → cmd05 登录 → READY</text>
<text x="1060.0" y="611.9" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">→ readiness 翻转 → consumer.resume()</text>
<text x="1060.0" y="701.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">登录安全约束</text>
<text x="1060.0" y="719.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">登录报文含用户名/密码，禁止明文落盘</text>
<text x="1060.0" y="737.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">password/secretKey/accessKey 脱敏</text>
<text x="1060.0" y="755.5" font-size="15.0" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">（@ToString.Exclude + MaskingPatternLayout）</text>
</svg>