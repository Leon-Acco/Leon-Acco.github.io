<text x="740.0" y="52.8" font-size="28.0" fill="#1e40af" text-anchor="middle" dominant-baseline="central" xml:space="preserve">dst-iot-car-calculator 里程计算作业 · 数据流架构</text>
<text x="740.0" y="91.0" font-size="15.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Kafka(32960 原始报文) → 解析清洗 → 里程异常检测 → Doris 原始表（小时聚合由 Doris SQL 完成）</text>
<text x="60.0" y="149.4" font-size="19.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">全链路总览</text>
<text x="60.0" y="307.4" font-size="19.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">Flink 作业内部 · VehicleMileageCalculatorJob</text>
<text x="115.0" y="197.7" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">车载终端</text>
<text x="279.9" y="197.7" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">32960 网关</text>
<text x="440.1" y="197.7" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Kafka</text>
<text x="440.1" y="240.6" font-size="11.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">byte[] · header.vin</text>
<text x="610.0" y="197.7" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Flink 本作业</text>
<text x="795.0" y="197.7" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Doris 原始表</text>
<text x="795.0" y="240.6" font-size="11.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">vehicle_mileage_data</text>
<text x="980.0" y="197.7" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">XXL-Job 聚合</text>
<text x="979.9" y="240.6" font-size="11.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">每小时刷近 7 天</text>
<text x="1160.0" y="197.7" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">小时汇总表</text>
<text x="1330.0" y="197.7" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">查询接口</text>
<text x="1330.0" y="240.6" font-size="11.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">/totalMileage</text>
<text x="165.0" y="381.6" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">VehicleRecordDeserializer</text>
<text x="165.0" y="397.2" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">32960 解析 + 入口粗筛</text>
<text x="60.0" y="465.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">· 只放行 cmd=0x02 实时 / 0x03 补发</text>
<text x="60.0" y="487.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">· 里程 ∈ (0, 999999)</text>
<text x="60.0" y="509.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">· 时间 ∈ [现在-30天, 现在+1天]</text>
<text x="60.0" y="531.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">· VIN 取自 Kafka header</text>
<text x="395.0" y="381.6" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">0 &lt; mileage</text>
<text x="395.0" y="397.2" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">≤ maxMileage ?</text>
<text x="395.0" y="458.6" font-size="11.0" fill="#64748b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Nacos 配置 maxMileage</text>
<text x="395.1" y="522.2" font-size="12.0" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">非法 → 丢弃</text>
<text x="735.0" y="334.0" font-size="15.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">MileageFilterFunction · 里程异常检测（keyBy uid）</text>
<text x="540.0" y="373.2" font-size="12.0" fill="#fef3c7" text-anchor="start" dominant-baseline="central" xml:space="preserve">实时链 cmd=0x02（严格校验）</text>
<text x="540.0" y="395.2" font-size="12.0" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve">回退 → 丢弃 ｜ 跳增 &gt; 100km → 丢弃</text>
<text x="540.0" y="423.2" font-size="12.0" fill="#fef3c7" text-anchor="start" dominant-baseline="central" xml:space="preserve">补发链 cmd=0x03（宽松校验）</text>
<text x="540.0" y="445.2" font-size="12.0" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve">跳增 &gt; 300km → 丢弃</text>
<text x="540.0" y="467.2" font-size="12.0" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve">回退三分支： 设备复位放行 / ≤300km 放行 / 其他丢弃</text>
<text x="540.0" y="495.2" font-size="12.0" fill="#fef3c7" text-anchor="start" dominant-baseline="central" xml:space="preserve">中位数过滤（两链共用窗口）</text>
<text x="540.0" y="517.2" font-size="12.0" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve">近 20 条中位数， 偏离 &gt; 500km → 丢弃（窗口未满直接放行）</text>
<text x="540.0" y="545.2" font-size="12.0" fill="#fef3c7" text-anchor="start" dominant-baseline="central" xml:space="preserve">Flink 状态（按 uid 隔离）：</text>
<text x="540.0" y="567.2" font-size="12.0" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve">lastRealtimeMileage / lastHistoryMileage（双链独立）</text>
<text x="540.0" y="589.2" font-size="12.0" fill="#ffffff" text-anchor="start" dominant-baseline="central" xml:space="preserve">mileageWindowState = 滑动窗口 20 条合法里程</text>
<text x="735.0" y="702.2" font-size="12.0" fill="#b91c1c" text-anchor="middle" dominant-baseline="central" xml:space="preserve">异常 → 丢弃（WARN 日志）</text>
<text x="1090.0" y="381.6" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">VehicleRawDataDorisSink</text>
<text x="1090.0" y="397.2" font-size="13.0" fill="#ffffff" text-anchor="middle" dominant-baseline="central" xml:space="preserve">JSON Stream Load</text>
<text x="990.0" y="465.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">· 批模式： 10000 行 / 3 秒 flush</text>
<text x="990.0" y="487.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">· Label = 表名 + 毫秒（唯一）</text>
<text x="1325.0" y="381.6" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Doris</text>
<text x="1325.0" y="397.2" font-size="13.0" fill="#374151" text-anchor="middle" dominant-baseline="central" xml:space="preserve">vehicle_mileage_data</text>
<text x="990.0" y="529.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">写入 Doris 的记录示例（Stream Load JSON）</text>
<text x="1006.0" y="568.2" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">{ &quot;uid&quot;: &quot;HGCH1KB68RZ015679&quot;,</text>
<text x="1006.0" y="582.6" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">  &quot;data_time&quot;: &quot;2026-09-10 13:01:51&quot;,</text>
<text x="1006.0" y="597.0" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">  &quot;vin&quot;: &quot;HGCH1KB68RZ015679&quot;,</text>
<text x="1006.0" y="611.4" font-size="12.0" fill="#22c55e" text-anchor="start" dominant-baseline="central" xml:space="preserve">  &quot;cmd&quot;: 2, &quot;mileage_total&quot;: 75827.9 }</text>
<text x="60.0" y="654.0" font-size="15.0" fill="#1e40af" text-anchor="start" dominant-baseline="central" xml:space="preserve">下游（不在本作业内）</text>
<text x="60.0" y="680.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">XXL-Job 每小时： INSERT..SELECT 按 uid + vin + 小时窗口 聚合</text>
<text x="60.0" y="702.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">mileage = MAX(mileage_total) − MIN(mileage_total)（小时极差 = 行驶里程）</text>
<text x="60.0" y="724.2" font-size="12.0" fill="#64748b" text-anchor="start" dominant-baseline="central" xml:space="preserve">产出 vehicle_mileage_summary_hourly → 查询接口 POST /vehicle/mileage/totalMileage</text>
</svg>